name: Python package

on:
  push:
    branches: [ "master" ]
    tags:
      - "*"
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Restore vcpkg cache
      uses: actions/cache/restore@v4
      with:
        path: ${{github.workspace}}/.cache/vcpkg
        key: vcpkg-${{runner.os}}-${{runner.arch}}-${{ hashFiles('vcpkg.json') }}
        restore-keys: vcpkg-${{runner.os}}-${{runner.arch}}-

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox

    - name: Test with tox
      env:
        CMAKE_TOOLCHAIN_FILE: '${{env.VCPKG_ROOT}}/scripts/buildsystems/vcpkg.cmake'
        VCPKG_BINARY_SOURCES: 'clear;files,${{github.workspace}}/.cache/vcpkg,readwrite'
      run: |
        tox -e py${{ matrix.python-version }}

    - name: Save vcpkg cache
      uses: actions/cache/save@v4
      with:
        path: ${{github.workspace}}/.cache/vcpkg
        key: vcpkg-${{runner.os}}-${{runner.arch}}-${{ hashFiles('vcpkg.json') }}

  pre-commit:
    name: Check pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: ${{github.workspace}}/.cache/vcpkg
          key: vcpkg-${{runner.os}}-${{runner.arch}}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{runner.os}}-${{runner.arch}}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Run pre-commit
        env:
          CMAKE_TOOLCHAIN_FILE: '${{env.VCPKG_ROOT}}/scripts/buildsystems/vcpkg.cmake'
          VCPKG_BINARY_SOURCES: 'clear;files,${{github.workspace}}/.cache/vcpkg,readwrite'
        run: |
          tox -e pre-commit

      - name: Save vcpkg cache
        uses: actions/cache/save@v4
        with:
          path: ${{github.workspace}}/.cache/vcpkg
          key: vcpkg-${{runner.os}}-${{runner.arch}}-${{ hashFiles('vcpkg.json') }}

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: [ build, pre-commit ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1

      - uses: actions/upload-artifact@v7
        with:
          name: artifact-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  make_sdist:
    name: Make sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build SDist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.tar.gz
          if-no-files-found: error
          name: artifact-sdist

  publish:
    name: Publish source and wheels
    needs: [ build_wheels, make_sdist ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: artifact-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
